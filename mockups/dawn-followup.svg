<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f8f6"/>
    </linearGradient>
    <linearGradient id="urgent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff4ec"/>
      <stop offset="1" stop-color="#ffe0d6"/>
    </linearGradient>
    <linearGradient id="normal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ecf6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1b2b3a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-weight:800;fill:#101417}
      .text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#101417}
      .muted{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#69737b}
      .label{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:15px;font-weight:800;letter-spacing:.25px}
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <g transform="translate(72 48)">
    <circle cx="23" cy="23" r="22" fill="#00a651"/>
    <path d="M15 18h18M15 24h24M15 30h14" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
    <text x="60" y="31" class="title" font-size="32">Dawn</text>
    <text x="1150" y="31" class="muted" font-size="18">Snapshot</text>
    <rect x="1245" y="0" width="120" height="46" rx="23" fill="#0b3658"/>
    <text x="1286" y="29" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="800" fill="#fff">Ask Dawn</text>
    <circle cx="1270" cy="23" r="9" fill="#fff"/>
  </g>
  <g transform="translate(86 135)">
    <text x="0" y="0" class="title" font-size="58">Followup</text>
    <text x="2" y="42" class="muted" font-size="22">The few activation threads you cannot afford to drop.</text>
  </g>

  <g transform="translate(86 240)" filter="url(#shadow)">
    <rect width="880" height="246" rx="36" fill="url(#urgent)"/>
    <rect x="34" y="34" width="122" height="34" rx="17" fill="#ffd2c0"/>
    <text x="56" y="56" class="label" fill="#b53223">CRITICAL</text>
    <text x="34" y="112" class="title" font-size="34">Send kickoff scheduling email today</text>
    <text x="34" y="153" class="text" font-size="22" font-weight="700">Riverside General</text>
    <text x="34" y="187" class="muted" font-size="19">Waiting on us for 9 days after EAA. Momentum is cooling.</text>
    <rect x="618" y="39" width="184" height="50" rx="25" fill="#fff"/>
    <text x="651" y="70" class="text" font-size="17" font-weight="800">Waiting on us</text>
    <g transform="translate(742 123)">
      <rect x="0" y="0" width="50" height="76" rx="25" fill="#fff"/>
      <path d="M25 18l-11 13h22z" fill="#c84631"/>
      <path d="M25 58l11-13H14z" fill="#b8a6a1"/>
    </g>
    <rect x="34" y="205" width="104" height="42" rx="21" fill="#101417"/>
    <text x="65" y="232" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="800" fill="#fff">Done</text>
  </g>

  <g transform="translate(1008 240)">
    <rect width="346" height="246" rx="36" fill="#ffffff" filter="url(#shadow)"/>
    <text x="28" y="48" class="title" font-size="26">Today</text>
    <text x="28" y="86" class="muted" font-size="18">3 actions, 1 urgent</text>
    <line x1="28" y1="112" x2="318" y2="112" stroke="#e6edf0" stroke-width="2"/>
    <text x="28" y="152" class="text" font-size="20" font-weight="750">Next email</text>
    <text x="28" y="185" class="muted" font-size="17">Riverside kickoff scheduling</text>
    <text x="28" y="219" class="muted" font-size="17">Due now</text>
  </g>

  <g transform="translate(86 526)" filter="url(#shadow)">
    <rect width="640" height="150" rx="32" fill="url(#normal)"/>
    <rect x="28" y="28" width="104" height="32" rx="16" fill="#e2f0ff"/>
    <text x="51" y="50" class="label" fill="#2f5f98">THIS WEEK</text>
    <text x="28" y="91" class="title" font-size="26">Confirm PI attendance before kickoff</text>
    <text x="28" y="123" class="muted" font-size="18">Northbridge Medical - kickoff Aug 12</text>
    <g transform="translate(558 36)">
      <rect x="0" y="0" width="48" height="78" rx="24" fill="#fff"/>
      <path d="M24 18l-10 12h20z" fill="#456c86"/>
      <path d="M24 60l10-12H14z" fill="#456c86"/>
    </g>
  </g>

  <g transform="translate(760 526)" filter="url(#shadow)">
    <rect width="594" height="150" rx="32" fill="#ffffff"/>
    <rect x="28" y="28" width="96" height="32" rx="16" fill="#eef4f7"/>
    <text x="54" y="50" class="label" fill="#64717a">WAITING</text>
    <text x="28" y="91" class="title" font-size="26">Send polite EAA reminder Friday</text>
    <text x="28" y="123" class="muted" font-size="18">Harborview University - waiting on hospital</text>
    <g transform="translate(512 36)">
      <rect x="0" y="0" width="48" height="78" rx="24" fill="#f2f6f8"/>
      <path d="M24 18l-10 12h20z" fill="#8b99a3"/>
      <path d="M24 60l10-12H14z" fill="#8b99a3"/>
    </g>
  </g>

  <g transform="translate(86 710)" filter="url(#shadow)">
    <rect width="1268" height="104" rx="30" fill="#ffffff"/>
    <text x="28" y="44" class="title" font-size="24">Click any followup and talk inside it.</text>
    <text x="28" y="76" class="muted" font-size="18">Example: \"Actually wait until after their legal meeting next Tuesday.\" Dawn suggests the edit, then asks for approval.</text>
    <rect x="1100" y="28" width="132" height="48" rx="24" fill="#00a651"/>
    <text x="1136" y="59" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="800" fill="#fff">Try voice</text>
  </g>
</svg>
