<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="page" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f9fa"/>
    </linearGradient>
    <linearGradient id="band" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset=".45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#203040" flood-opacity="0.09"/>
    </filter>
    <style>
      .title{font-family:"Open Sauce Sans","Open Sauce One",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-weight:800;fill:#101417}
      .text{font-family:"Open Sauce Sans","Open Sauce One",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#101417}
      .muted{font-family:"Open Sauce Sans","Open Sauce One",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#6a747e}
      .label{font-family:"Open Sauce Sans","Open Sauce One",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#page)"/>
  <rect x="44" y="32" width="1352" height="836" rx="40" fill="#ffffff"/>
  <g transform="translate(82 70)">
    <path d="M0 22h30M0 13h22M0 31h22" stroke="#00A651" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M30 8l15 14-15 14" fill="none" stroke="#2F5F98" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="66" y="31" class="title" font-size="31">Dawn</text>
    <text x="1096" y="28" class="muted" font-size="17">Default: Snapshot</text>
    <rect x="1232" y="-8" width="78" height="42" rx="21" fill="#0d3655"/>
    <circle cx="1260" cy="13" r="8" fill="#fff"/>
  </g>
  <g transform="translate(96 148)">
    <text x="0" y="0" class="title" font-size="50">Followup</text>
    <text x="2" y="39" class="muted" font-size="21">A short queue for hospital communications that need action.</text>
  </g>

  <g transform="translate(96 230)">
    <rect width="1248" height="152" rx="34" fill="url(#band)" filter="url(#shadow)"/>
    <circle cx="1104" cy="76" r="72" fill="#ffd48a" opacity=".38"/>
    <circle cx="1104" cy="76" r="38" fill="#ffac54" opacity=".28"/>
    <text x="32" y="52" class="label" fill="#b0442e">Top risk</text>
    <text x="32" y="94" class="title" font-size="34">Hospital ready, kickoff not scheduled.</text>
    <text x="32" y="126" class="muted" font-size="19">Riverside has waited 9 days since EAA signoff. This is waiting on us.</text>
  </g>

  <g transform="translate(96 428)">
    <g filter="url(#shadow)">
      <rect width="794" height="118" rx="28" fill="#fff6f1"/>
      <rect x="28" y="32" width="8" height="54" rx="4" fill="#ff6f4a"/>
      <text x="58" y="50" class="title" font-size="25">Send kickoff scheduling email</text>
      <text x="58" y="82" class="muted" font-size="17">Riverside General - waiting on us 9 days</text>
      <rect x="594" y="33" width="88" height="52" rx="26" fill="#0f1417"/>
      <text x="621" y="66" font-family="Open Sauce Sans, Open Sauce One, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff">Done</text>
      <rect x="700" y="22" width="52" height="74" rx="26" fill="#ffffff"/>
      <path d="M726 40l-11 13h22z" fill="#c84a32"/>
      <path d="M726 77l11-13h-22z" fill="#aaa"/>
    </g>
    <g transform="translate(0 146)" filter="url(#shadow)">
      <rect width="794" height="118" rx="28" fill="#ffffff"/>
      <rect x="28" y="32" width="8" height="54" rx="4" fill="#2F5F98"/>
      <text x="58" y="50" class="title" font-size="25">Confirm PI attendance</text>
      <text x="58" y="82" class="muted" font-size="17">Northbridge Medical - kickoff Aug 12</text>
      <rect x="594" y="33" width="88" height="52" rx="26" fill="#eef4f7"/>
      <text x="621" y="66" class="text" font-size="15" font-weight="800">Done</text>
      <rect x="700" y="22" width="52" height="74" rx="26" fill="#f4f7f8"/>
      <path d="M726 40l-11 13h22z" fill="#667785"/>
      <path d="M726 77l11-13h-22z" fill="#667785"/>
    </g>
    <g transform="translate(0 292)" filter="url(#shadow)">
      <rect width="794" height="118" rx="28" fill="#ffffff"/>
      <rect x="28" y="32" width="8" height="54" rx="4" fill="#b7c1c7"/>
      <text x="58" y="50" class="title" font-size="25">Send EAA reminder</text>
      <text x="58" y="82" class="muted" font-size="17">Harborview University - waiting on hospital 8 days</text>
      <rect x="594" y="33" width="88" height="52" rx="26" fill="#eef4f7"/>
      <text x="621" y="66" class="text" font-size="15" font-weight="800">Done</text>
      <rect x="700" y="22" width="52" height="74" rx="26" fill="#f4f7f8"/>
      <path d="M726 40l-11 13h22z" fill="#9aa5ad"/>
      <path d="M726 77l11-13h-22z" fill="#9aa5ad"/>
    </g>
  </g>

  <g transform="translate(930 428)" filter="url(#shadow)">
    <rect width="414" height="410" rx="32" fill="#ffffff"/>
    <text x="30" y="48" class="title" font-size="28">Ask Dawn</text>
    <text x="30" y="82" class="muted" font-size="18">Talk inside a followup to update details without opening a form.</text>
    <rect x="30" y="118" width="354" height="156" rx="26" fill="#f6f9fa"/>
    <text x="56" y="160" class="text" font-size="20" font-weight="760">“Wait until after legal review next Tuesday.”</text>
    <text x="56" y="202" class="muted" font-size="17">Dawn suggests the edit and asks for approval.</text>
    <rect x="30" y="304" width="170" height="50" rx="25" fill="#00A651"/>
    <text x="80" y="336" font-family="Open Sauce Sans, Open Sauce One, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#fff">Approve</text>
    <rect x="216" y="304" width="114" height="50" rx="25" fill="#eef4f7"/>
    <text x="253" y="336" class="text" font-size="16" font-weight="800">Edit</text>
  </g>
</svg>
