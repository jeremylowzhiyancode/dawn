<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="page" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#f7fafb"/>
      <stop offset="1" stop-color="#f1f8f5"/>
    </linearGradient>
    <linearGradient id="risk" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff5ef"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#1a2b3a" flood-opacity="0.10"/>
    </filter>
    <style>
      .title{font-family:"Open Sauce Sans","Open Sauce One",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-weight:800;fill:#101417}
      .text{font-family:"Open Sauce Sans","Open Sauce One",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#101417}
      .muted{font-family:"Open Sauce Sans","Open Sauce One",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#69747d}
      .label{font-family:"Open Sauce Sans","Open Sauce One",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#page)"/>
  <g transform="translate(70 42)">
    <path d="M0 24h30M0 15h22M0 33h22" stroke="#00A651" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M30 10l15 14-15 14" fill="none" stroke="#2F5F98" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="66" y="33" class="title" font-size="31">Dawn</text>
    <g transform="translate(1098 -2)">
      <rect width="126" height="46" rx="23" fill="#eef4f7"/>
      <text x="28" y="29" class="text" font-size="15" font-weight="800">Snapshot</text>
    </g>
    <g transform="translate(1242 -2)">
      <rect width="104" height="46" rx="23" fill="#0d3655"/>
      <circle cx="31" cy="23" r="8" fill="#fff"/>
      <text x="50" y="29" font-family="Open Sauce Sans, Open Sauce One, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff">Ask</text>
    </g>
  </g>

  <g transform="translate(82 128)">
    <text x="0" y="0" class="title" font-size="54">Followup</text>
    <text x="2" y="40" class="muted" font-size="21">What the CEO should do next, ranked by momentum risk.</text>
  </g>

  <g transform="translate(82 218)">
    <g filter="url(#shadow)">
      <rect width="1276" height="578" rx="38" fill="#ffffff"/>
      <rect x="28" y="28" width="1220" height="186" rx="32" fill="url(#risk)"/>
      <circle cx="1110" cy="98" r="92" fill="#ffcc80" opacity=".28"/>
      <path d="M780 160C896 122 1000 148 1128 106C1176 91 1210 78 1248 62V214H780Z" fill="#fff" opacity=".62"/>
      <rect x="62" y="58" width="126" height="32" rx="16" fill="#ffdfd0"/>
      <text x="86" y="79" class="label" fill="#b3432d">Waiting on us</text>
      <text x="62" y="126" class="title" font-size="34">Riverside General needs kickoff scheduled.</text>
      <text x="62" y="162" class="muted" font-size="19">EAA signed 9 days ago. Follow up today to keep the site warm.</text>
      <rect x="62" y="234" width="816" height="86" rx="26" fill="#fbfcfd"/>
      <text x="92" y="268" class="text" font-size="23" font-weight="780">Send kickoff scheduling email today</text>
      <text x="92" y="297" class="muted" font-size="17">Owner: CEO - Source: messy note, today</text>
      <rect x="716" y="251" width="90" height="48" rx="24" fill="#101417"/>
      <text x="743" y="282" font-family="Open Sauce Sans, Open Sauce One, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff">Done</text>
      <rect x="820" y="242" width="42" height="66" rx="21" fill="#ffffff" stroke="#edf1f3"/>
      <path d="M841 258l-9 11h18z" fill="#c34a34"/>
      <path d="M841 292l9-11h-18z" fill="#9ba7ae"/>
      <rect x="62" y="340" width="816" height="86" rx="26" fill="#ffffff" stroke="#edf1f3"/>
      <text x="92" y="374" class="text" font-size="23" font-weight="760">Confirm PI attendance before Aug 12</text>
      <text x="92" y="403" class="muted" font-size="17">Northbridge Medical - kickoff scheduled</text>
      <rect x="62" y="446" width="816" height="86" rx="26" fill="#ffffff" stroke="#edf1f3"/>
      <text x="92" y="480" class="text" font-size="23" font-weight="760">Send EAA reminder Friday</text>
      <text x="92" y="509" class="muted" font-size="17">Harborview University - waiting on hospital</text>
      <g transform="translate(934 250)">
        <text x="0" y="0" class="title" font-size="27">One-click priority</text>
        <text x="0" y="38" class="muted" font-size="18">Move a followup up or down. Dawn makes the highest risk larger and more visible.</text>
        <line x1="0" y1="94" x2="248" y2="94" stroke="#e6edf0" stroke-width="2"/>
        <text x="0" y="138" class="title" font-size="27">Talk to edit</text>
        <text x="0" y="176" class="muted" font-size="18">Click any task and speak the real-world context. Dawn asks before changing data.</text>
      </g>
    </g>
  </g>
</svg>
