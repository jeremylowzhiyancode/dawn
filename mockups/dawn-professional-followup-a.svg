<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="page" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#f8fafb"/>
      <stop offset="1" stop-color="#eef8f4"/>
    </linearGradient>
    <linearGradient id="dawn" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff9f0"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf5ff"/>
    </linearGradient>
    <linearGradient id="urgent" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7f2"/>
      <stop offset="1" stop-color="#ffe8dd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#122033" flood-opacity="0.10"/>
    </filter>
    <style>
      .font{font-family:"Open Sauce Sans","Open Sauce One",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
      .title{font-family:"Open Sauce Sans","Open Sauce One",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-weight:800;fill:#0f1417}
      .text{font-family:"Open Sauce Sans","Open Sauce One",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#0f1417}
      .muted{font-family:"Open Sauce Sans","Open Sauce One",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#6d7680}
      .label{font-family:"Open Sauce Sans","Open Sauce One",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#page)"/>
  <g transform="translate(72 44)">
    <g>
      <path d="M0 26h32M0 17h23M0 35h23" stroke="#00A651" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M32 12l15 14-15 14" fill="none" stroke="#2F5F98" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="66" y="34" class="title" font-size="31">Dawn</text>
    </g>
    <text x="1120" y="31" class="muted" font-size="17">Snapshot</text>
    <rect x="1218" y="0" width="130" height="46" rx="23" fill="#0e3555"/>
    <circle cx="1245" cy="23" r="8" fill="#fff"/>
    <rect x="1242" y="11" width="6" height="22" rx="3" fill="#fff"/>
    <text x="1264" y="29" font-family="Open Sauce Sans, Open Sauce One, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff">Ask Dawn</text>
  </g>

  <g transform="translate(84 126)">
    <text x="0" y="0" class="title" font-size="54">Followup</text>
    <text x="2" y="40" class="muted" font-size="21">The few hospital activation threads that cannot slip.</text>
  </g>

  <g transform="translate(84 216)">
    <rect width="1272" height="118" rx="30" fill="#ffffff" filter="url(#shadow)"/>
    <g transform="translate(32 30)">
      <text x="0" y="22" class="muted" font-size="16">Activation health</text>
      <text x="0" y="58" class="title" font-size="32">2 waiting on us</text>
    </g>
    <g transform="translate(352 30)">
      <text x="0" y="22" class="muted" font-size="16">Kickoff risk</text>
      <text x="0" y="58" class="title" font-size="32">1 overdue</text>
    </g>
    <g transform="translate(636 30)">
      <text x="0" y="22" class="muted" font-size="16">Hospital side</text>
      <text x="0" y="58" class="title" font-size="32">3 pending</text>
    </g>
    <g transform="translate(940 30)">
      <text x="0" y="22" class="muted" font-size="16">This week</text>
      <text x="0" y="58" class="title" font-size="32">4 followups</text>
    </g>
  </g>

  <g transform="translate(84 380)" filter="url(#shadow)">
    <rect width="872" height="250" rx="34" fill="url(#urgent)"/>
    <circle cx="760" cy="88" r="92" fill="#ffcf85" opacity=".36"/>
    <circle cx="760" cy="88" r="56" fill="#ffa65a" opacity=".32"/>
    <path d="M0 187C150 156 294 178 437 153C584 127 710 126 872 92V250H0Z" fill="#ffffff" opacity=".56"/>
    <rect x="34" y="34" width="124" height="32" rx="16" fill="#ffdfd0"/>
    <text x="57" y="55" class="label" fill="#b3432d">Urgent</text>
    <text x="34" y="112" class="title" font-size="34">Schedule kickoff today</text>
    <text x="34" y="150" class="text" font-size="22" font-weight="760">Riverside General</text>
    <text x="34" y="184" class="muted" font-size="19">Waiting on us for 9 days after EAA signoff.</text>
    <rect x="34" y="204" width="102" height="42" rx="21" fill="#0f1417"/>
    <text x="65" y="231" font-family="Open Sauce Sans, Open Sauce One, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff">Done</text>
    <rect x="708" y="162" width="52" height="72" rx="26" fill="#ffffff"/>
    <path d="M734 181l-11 13h22z" fill="#b3432d"/>
    <path d="M734 216l11-13h-22z" fill="#b8a9a2"/>
  </g>

  <g transform="translate(990 380)" filter="url(#shadow)">
    <rect width="366" height="250" rx="34" fill="#ffffff"/>
    <text x="30" y="48" class="title" font-size="27">Why it matters</text>
    <text x="30" y="88" class="muted" font-size="18">The hospital is ready. Dawn is flagging the delay before momentum cools.</text>
    <line x1="30" y1="126" x2="336" y2="126" stroke="#e8edf0" stroke-width="2"/>
    <text x="30" y="166" class="text" font-size="19" font-weight="760">Suggested email</text>
    <text x="30" y="199" class="muted" font-size="17">Kickoff scheduling</text>
    <text x="30" y="228" class="muted" font-size="17">Owner: CEO</text>
  </g>

  <g transform="translate(84 666)" filter="url(#shadow)">
    <rect width="610" height="146" rx="30" fill="url(#dawn)"/>
    <rect x="28" y="26" width="108" height="30" rx="15" fill="#e1efff"/>
    <text x="50" y="46" class="label" fill="#2F5F98">This week</text>
    <text x="28" y="88" class="title" font-size="25">Confirm PI attendance</text>
    <text x="28" y="119" class="muted" font-size="18">Northbridge Medical - kickoff Aug 12</text>
  </g>
  <g transform="translate(736 666)" filter="url(#shadow)">
    <rect width="620" height="146" rx="30" fill="#ffffff"/>
    <rect x="28" y="26" width="104" height="30" rx="15" fill="#eef4f7"/>
    <text x="50" y="46" class="label" fill="#65727b">Waiting</text>
    <text x="28" y="88" class="title" font-size="25">Send EAA reminder Friday</text>
    <text x="28" y="119" class="muted" font-size="18">Harborview University - waiting on hospital</text>
  </g>
</svg>
